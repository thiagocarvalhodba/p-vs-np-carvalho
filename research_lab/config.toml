[lab]
max_rounds = 10
max_stale_rounds = 2
proof_confirmation_rounds = 2
stop_on_exact_refutation = true
parallel_independent_pass = true

[paths]
claim = "research_lab/CURRENT_CLAIM.md"
certified_facts = "research_lab/CERTIFIED_FACTS.md"
open_obligations = "research_lab/OPEN_OBLIGATIONS.md"
rejected_arguments = "research_lab/REJECTED_ARGUMENTS.md"
rounds_dir = "research_lab/rounds"
runtime_dir = "research_lab/runtime"
schema = "research_lab/schemas/adjudication.schema.json"

[codex]
binary = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
sandbox = "read-only"
timeout_seconds = 3600

[gemini]
binary = "gemini"
approval_mode = "plan"
output_format = "json"
timeout_seconds = 3600
# Leave empty to use the Gemini CLI configured/default model.
model = ""

[safety]
allow_git_commit = false
allow_git_push = false
allow_git_merge = false
allow_official_manuscript_edits = false
