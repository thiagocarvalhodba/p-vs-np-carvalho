name: Rebuild arXiv package

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/rebuild_arxiv_package.yml'
      - 'Publicacoes/CLG_FOUNDATIONS_ARXIV.tex'
      - 'Publicacoes/clg_references.bib'
      - 'Publicacoes/CLG_FOUNDATIONS_ARXIV.bbl'
      - 'Publicacoes/*.png'
      - 'Publicacoes/*.jpg'
      - 'Publicacoes/*.jpeg'
      - 'Publicacoes/*.pdf'
      - 'Publicacoes/Papers_CLGR/**/*.tex'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX toolchain and restore raster figures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            librsvg2-bin \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-portuguese \
            lmodern \
            poppler-utils
          cd Publicacoes
          python3 - <<'PY'
          import pathlib, re, subprocess
          tex = pathlib.Path("CLG_FOUNDATIONS_ARXIV.tex").read_text(encoding="utf-8")
          for name in re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}', tex):
              p = pathlib.Path(name)
              if p.exists():
                  continue
              if p.suffix.lower() == ".png":
                  svg = p.with_suffix(".svg")
                  if svg.exists():
                      subprocess.run(["rsvg-convert", "-o", str(p), str(svg)], check=True)
                      print(f"generated {p} from {svg}")
          PY

      - name: Compile manuscript and fail on unresolved references
        shell: bash
        run: |
          set -euo pipefail
          cd Publicacoes

          latexmk -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            CLG_FOUNDATIONS_ARXIV.tex

          test -s CLG_FOUNDATIONS_ARXIV.pdf

          if grep -Eq \
            'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' \
            CLG_FOUNDATIONS_ARXIV.log; then
            echo "Unresolved LaTeX citation/reference detected"
            grep -E \
              'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' \
              CLG_FOUNDATIONS_ARXIV.log || true
            exit 1
          fi

          if grep -Eq 'Label .* multiply defined|multiply-defined labels' CLG_FOUNDATIONS_ARXIV.log; then
            echo "Multiply-defined LaTeX label detected"
            grep -E 'Label .* multiply defined|multiply-defined labels' CLG_FOUNDATIONS_ARXIV.log || true
            exit 1
          fi

          echo "=== PDF INFO ==="
          pdfinfo CLG_FOUNDATIONS_ARXIV.pdf | grep -E '^(Pages|Page size|File size):' || true

          echo "=== NON-FATAL LATEX WARNINGS ==="
          grep -E '^(LaTeX|Package .* Warning)' CLG_FOUNDATIONS_ARXIV.log || true

      - name: Upload compiled manuscript and log
        uses: actions/upload-artifact@v4
        with:
          name: clg-r-v4.0.5-compiled
          path: |
            Publicacoes/CLG_FOUNDATIONS_ARXIV.pdf
            Publicacoes/CLG_FOUNDATIONS_ARXIV.log
          if-no-files-found: error
          retention-days: 30

      - name: Compile bilingual CLG-R papers
        shell: bash
        run: |
          set -euo pipefail
          for dir in Publicacoes/Papers_CLGR/EN Publicacoes/Papers_CLGR/PT; do
            pushd "$dir" >/dev/null
            for tex in *.tex; do
              echo "Compiling $dir/$tex"
              latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error "$tex"
              pdf="${tex%.tex}.pdf"
              test -s "$pdf"
              log="${tex%.tex}.log"
              if grep -Eq 'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' "$log"; then
                echo "Unresolved citation/reference in $dir/$tex"
                exit 1
              fi
            done
            popd >/dev/null
          done

      - name: Upload bilingual paper PDFs
        uses: actions/upload-artifact@v4
        with:
          name: clg-r-bilingual-papers
          path: |
            Publicacoes/Papers_CLGR/EN/*.pdf
            Publicacoes/Papers_CLGR/PT/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Build deterministic arXiv source package
        shell: bash
        run: |
          set -euo pipefail
          cd Publicacoes
          python3 - <<'PY'
          import hashlib, pathlib, re, zipfile, os
          root = pathlib.Path(".")
          tex = root / "CLG_FOUNDATIONS_ARXIV.tex"
          text = tex.read_text(encoding="utf-8")

          files = [tex]
          bib = root / "clg_references.bib"
          if bib.exists():
              files.append(bib)
          bbl = root / "CLG_FOUNDATIONS_ARXIV.bbl"
          if bbl.exists():
              files.append(bbl)

          for name in re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^}]+)\}', text):
              p = root / name
              if not p.suffix:
                  for ext in (".pdf", ".png", ".jpg", ".jpeg"):
                      q = p.with_suffix(ext)
                      if q.exists():
                          p = q
                          break
              if not p.exists():
                  raise SystemExit(f"Missing figure referenced by TeX: {name}")
              files.append(p)

          unique = []
          seen = set()
          for p in files:
              p = p.resolve()
              if p not in seen:
                  seen.add(p)
                  unique.append(p)

          manifest_lines = [
              "CLG-R arXiv source package",
              "Source commit: " + os.environ.get("GITHUB_SHA", "unknown"),
              "",
          ]
          for p in sorted(unique, key=lambda x: x.name):
              data = p.read_bytes()
              manifest_lines.append(f"{hashlib.sha256(data).hexdigest()}  {p.name}")

          manifest = "\n".join(manifest_lines) + "\n"
          (root / "ARXIV_PACKAGE_MANIFEST.txt").write_text(manifest, encoding="utf-8")
          out = root / "arxiv_package.zip"
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(unique, key=lambda x: x.name):
                  z.write(p, p.name)
              z.writestr("ARXIV_PACKAGE_MANIFEST.txt", manifest)

          print("Package files:")
          for p in sorted(unique, key=lambda x: x.name):
              print(" -", p.name)
          print("ZIP SHA256:", hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Commit regenerated publication artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Publicacoes/arxiv_package.zip Publicacoes/ARXIV_PACKAGE_MANIFEST.txt
          git add Publicacoes/CLG_FOUNDATIONS_ARXIV.bbl || true
          git add -f Publicacoes/CLG_FOUNDATIONS_ARXIV.pdf
          git add -f Publicacoes/Papers_CLGR/EN/*.pdf
          git add -f Publicacoes/Papers_CLGR/PT/*.pdf
          git add -f Publicacoes/*.png || true

          if git diff --cached --quiet; then
            echo "Publication artifacts already current"
            exit 0
          fi

          git commit -m "build(publications): regenerate manuscript and bilingual papers"
          git pull --rebase origin master
          git push origin HEAD:master
